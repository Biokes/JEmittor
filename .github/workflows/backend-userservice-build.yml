name: Backend UserService Build

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'Backend/userService/**'
      - '.github/workflows/backend-userservice-build.yml'
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'Backend/userService/**'
      - '.github/workflows/backend-userservice-build.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: Backend/userService
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build with Maven
        run: ./mvnw clean compile --batch-mode --no-transfer-progress
      
      - name: Run tests
        run: ./mvnw test --batch-mode --no-transfer-progress
        continue-on-error: false
      
      - name: Package application
        run: ./mvnw package -DskipTests --batch-mode --no-transfer-progress
      
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: userservice-jar
          path: Backend/userService/target/*.jar
          retention-days: 7
